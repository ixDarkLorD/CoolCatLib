apply from: "https://raw.githubusercontent.com/ixDarkLorD/ModResources/main/gradle/v3/fabric.gradle"

loom {
    runs {
        client {
            setConfigName("${helper.uppercaseFirstChar(project.name)} Client ${libs.versions.minecraft.get()}")
        }
        server {
            setConfigName("${helper.uppercaseFirstChar(project.name)} Server ${libs.versions.minecraft.get()}")
        }
    }
}

dependencies {
    api libs.jei.api.fabric
    implementation libs.jei.fabric

    implementation project(path: ":fabric")
}