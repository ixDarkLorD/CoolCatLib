site_name: CoolCatLib
site_description: "CoolCatLib: the cross-loader foundation and visuals for Minecraft mods, in one library."
site_author: ixDarkLorD
site_url: https://ixdarklord.github.io/CoolCatLib/
repo_url: https://github.com/ixDarkLorD/CoolCatLib
repo_name: ixDarkLorD/CoolCatLib
edit_uri: edit/docs/docs/
copyright: "Made with 🐱 by ixDarkLorD · MPL-2.0"

theme:
  name: material
  custom_dir: overrides
  logo: assets/core-small.png
  favicon: assets/favicon.png
  icon:
    repo: fontawesome/brands/github
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  features:
    - navigation.expand
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.path
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit

hooks:
  - hooks/changelog.py

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mc-version.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ixDarkLorD/CoolCatLib
      name: Source on GitHub
      label: GitHub
    - icon: simple/curseforge
      link: https://www.curseforge.com/minecraft/mc-mods/coolcatlib
      name: "CoolCatLib on CurseForge"
      label: CurseForge
    - icon: simple/modrinth
      link: https://modrinth.com/mod/coolcatlib
      name: "CoolCatLib on Modrinth"
      label: Modrinth

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      title: On this page
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Core:
      - core/index.md
      - Events: core/events.md
      - Registration: core/registration.md
      - Networking: core/networking.md
      - Configs: core/configs.md
      - Attachments: core/attachments.md
      - Containers and Menus: core/containers-and-menus.md
      - Item Decorators: core/item-decorators.md
      - Game Tests: core/game-tests.md
      - Platform and Utilities: core/platform-and-utilities.md
  - Canvas:
      - canvas/index.md
      - Screen Effects: canvas/screen-effects.md
      - Skyboxes: canvas/skyboxes.md
      - World Effects: canvas/world-effects.md
      - Cutscenes: canvas/cutscenes.md
      - Sound Filters: canvas/sound-filters.md
      - Text and Colors: canvas/text-and-colors.md
      - GUI: canvas/gui.md
  - Reference: reference/api.md
  - Changelog: changelog.md
