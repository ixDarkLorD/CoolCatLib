pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url "https://maven.architectury.dev/" }
        maven { url "https://maven.fabricmc.net/" }
        maven { url "https://maven.neoforged.net/releases/" }
        maven { url "https://maven.minecraftforge.net/" }
        maven { url "https://maven.firstdark.dev/releases" }
    }
    resolutionStrategy {
        eachPlugin {
            // Shadow 8.1.1 (pinned by the shared v3 scripts) is incompatible with Gradle 9;
            // GradleUp's Shadow still registers the old plugin ID.
            if (requested.id.id == "com.github.johnrengelman.shadow") {
                useModule("com.gradleup.shadow:shadow-gradle-plugin:8.3.11")
            }
        }
    }
}

// Folder -> project name prefix. The shared build scripts look CoolCat Core's modules up as ":common" and the loader
// names, so Core's projects have no prefix.
def modules = ["common"] + project_loaders.split(",").toList()
def folders = [
        core    : [prefix: "", modules: modules],
        canvas  : [prefix: "canvas-", modules: modules],
        testmods: [prefix: "testmod-", modules: modules - "common"],
]
folders.each { folder, layout ->
    layout.modules.each { module ->
        def path = ":${layout.prefix}${module}"
        include(path)
        project(path).projectDir = file("$folder/$module")
    }
}

// The shared scripts read the mod's attributes (modid, mod_name, ...) from gradle.properties, where they describe
// CoolCat Core. Canvas's projects get their own from the canvas_* properties, before any build script runs.
def canvasAttributes = providers.gradlePropertiesPrefixedBy("canvas_").get()
        .collectEntries { key, value -> [(key - "canvas_"): value] }
gradle.projectsLoaded {
    it.rootProject.subprojects.findAll { it.name.startsWith("canvas-") }.each { project ->
        canvasAttributes.each { key, value -> project.ext.set(key, value) }
    }
}

apply from: "https://raw.githubusercontent.com/ixDarkLorD/ModResources/main/gradle/v3/settings.gradle"
