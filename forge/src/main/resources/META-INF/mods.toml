modLoader = "javafml"
loaderVersion = "[47,)"
issueTrackerURL = "${mod_issue_url}"
license = "${mod_license}"

[[mods]]
modId = "${modid}"
displayName = "${mod_name}"
version = "${version}"
description = "${mod_description}"
authors = "${mod_author}"
logoFile = "mod_logo.png"
displayURL = "${mod_page_url}"
updateJSONURL = "${mod_forge_update_url}"
displayTest = "${mod_forge_display_test}"

[[dependencies.${modid}]]
modId = "forge"
mandatory = true
versionRange = "[${min_forge_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${modid}]]
modId = "minecraft"
mandatory = true
versionRange = "[${mc_version},) , (,${max_mc_version}]"
ordering = "NONE"
side = "BOTH"

# CoolCatLib Canvas comes inside this jar. Forge 47 has no incompatible dependencies, so the old CoolCatLib: Canvas
# jars (versioned 1.20.1-N and 2001.x) are refused through an optional dependency they fall outside of.
[[dependencies.${modid}]]
modId = "coolcatcanvas"
mandatory = false
versionRange = "[8,2000)"
ordering = "NONE"
side = "BOTH"

[modproperties.${modid}]
catalogueImageIcon = "mod_logo.png"
