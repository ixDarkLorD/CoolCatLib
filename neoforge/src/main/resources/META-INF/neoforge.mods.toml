modLoader = "javafml"
loaderVersion = "[${min_neoforge_fml_version},)"
issueTrackerURL = "${mod_issue_url}"
license = "${mod_license}"

[[mods]]
modId = "${modid}"
displayName = "${mod_name}"
version = "${version}"
description = "${mod_description}"
authors = "${mod_author}"
iconFile = "mod_logo.png"
updateJSONURL = "${mod_neoforge_update_url}"

# Configured (MrCrayfish) lists every mod's CoolCatLib configs in its screens through this provider.
[modproperties.${modid}]
# A library: mod lists like Glazed Menu show it under Libraries.
library = true
configuredProviders = ["net.ixdarklord.coolcatcore.internal.integration.configured.ConfiguredProvider"]

[[mixins]]
config = "${modid}.common.mixins.json"

[[mixins]]
config = "${modid}.neoforge.mixins.json"


[[dependencies.${modid}]]
modId = "neoforge"
type = "required"
versionRange = "[${project.supported_min_neoforge_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${modid}]]
modId = "minecraft"
type = "required"
versionRange = "[${project.supported_min_mc_version},${max_mc_version}]"
ordering = "NONE"
side = "BOTH"

# CoolCatLib: Core, which this jar replaces, and the old CoolCatLib: Canvas jars (versioned 26.x): Canvas comes inside
# this jar now.
[[dependencies.${modid}]]
modId = "coolcatcore"
type = "incompatible"
reason = "CoolCatLib: Core and Canvas are part of CoolCatLib now; remove their jars."
versionRange = "[0,)"
side = "BOTH"

[[dependencies.${modid}]]
modId = "coolcatcanvas"
type = "incompatible"
reason = "CoolCatLib Canvas comes inside CoolCatLib now; remove the old CoolCatLib: Canvas jar."
versionRange = "[26,)"
side = "BOTH"

# Glazed Menu before 1.2.2 (and its old 26.x versions) looks for the config screen effects where they were before 9.0.0.
[[dependencies.${modid}]]
modId = "glazedmenu"
type = "incompatible"
reason = "This CoolCatLib needs Glazed Menu 1.2.2 or newer; update Glazed Menu."
versionRange = "(,1.2.2),[26,)"
side = "CLIENT"
