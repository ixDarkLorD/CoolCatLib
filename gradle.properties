# Gradle
# Minecraft decompilation needs the memory; the daemon and build cache keep repeated builds fast.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Dev Runs
runtime_min_ram=1G
runtime_max_ram=4G
mixin_debug=false

# Shared by both mods
mod_version=1
mod_author=ixDarkLorD
mod_license=MPL-2.0
mod_maven_group=net.ixdarklord
mod_issue_url=https://github.com/ixDarkLorD/CoolCatLib/issues
mod_source_url=https://github.com/ixDarkLorD/CoolCatLib
# "*" for a mod loaded on both sides, "server" for a server only mod, "client" for a client only mod
mod_environment=*
# (Forge) "MATCH_VERSION" for both sides, "IGNORE_SERVER_VERSION" for server only, "IGNORE_ALL_VERSION" for client only
mod_forge_display_test=MATCH_VERSION
dependencies_catalog_version=26.1.2-v2

# CoolCatLib: Core (the shared build scripts read these names)
modid=coolcatcore
mod_name=CoolCatLib: Core
mod_description=The core of the CoolCat libraries: mod constructors, events, networking, registries, configs, attachments, containers and menus.
mod_page_url=https://legacy.curseforge.com/minecraft/mc-mods/coolcatlib
mod_forge_update_url=https://raw.githubusercontent.com/ixDarkLorD/ModUpdateJSONs/refs/heads/main/forge/coolcatcore.json
mod_neoforge_update_url=https://raw.githubusercontent.com/ixDarkLorD/ModUpdateJSONs/refs/heads/main/neoforge/coolcatcore.json

# CoolCatLib: Canvas (settings.gradle hands these to its projects without the "canvas_" prefix)
canvas_modid=coolcatcanvas
canvas_mod_name=CoolCatLib: Canvas
canvas_mod_description=The visual side of the CoolCat libraries: screen effects, skyboxes, GUI widgets and render utilities. Built on CoolCatLib: Core.
canvas_mod_page_url=https://github.com/ixDarkLorD/CoolCatLib
canvas_mod_forge_update_url=https://raw.githubusercontent.com/ixDarkLorD/ModUpdateJSONs/refs/heads/main/forge/coolcatcanvas.json
canvas_mod_neoforge_update_url=https://raw.githubusercontent.com/ixDarkLorD/ModUpdateJSONs/refs/heads/main/neoforge/coolcatcanvas.json

# Publishing
copy_build_jar=true
project_upload_debug=false
project_loaders=fabric,neoforge
project_release_type=release
project_game_versions=26.1,26.1.1,26.1.2
project_curse_id=916525
project_modrinth_id=
fabric_publish_dependencies=requirement[],optional[]
neoforge_publish_dependencies=requirement[],optional[]
