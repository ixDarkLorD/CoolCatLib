// Folder -> project name prefix. The shared build scripts look CoolCatLib: Core's modules up as ":common" and the loader
// names, so Core's projects have no prefix.
def modules = ["common"] + project_loaders.split(",").toList()
def folders = [
        core    : [prefix: "", modules: modules],
        canvas  : [prefix: "canvas-", modules: modules],
        testmods: [prefix: "testmod-", modules: modules - "common"],
]
folders.each { folder, layout ->
    layout.modules.each { module ->
        def path = ":${layout.prefix}${module}"
        include(path)
        project(path).projectDir = file("$folder/$module")
    }
}

// The shared scripts read the mod's attributes (modid, mod_name, ...) from gradle.properties, where they describe
// CoolCatLib: Core. The add-on mod's projects (canvas-*) get their own from the canvas_* properties, before any build
// script runs.
def addons = ["canvas"]
def addonAttributes = addons.collectEntries { addon ->
    [(addon): providers.gradlePropertiesPrefixedBy("${addon}_").get().collectEntries { key, value -> [(key - "${addon}_"): value] }]
}
gradle.projectsLoaded {
    it.rootProject.subprojects.each { project ->
        def addon = addons.find { project.name.startsWith("$it-") }
        if (addon != null) addonAttributes[addon].each { key, value -> project.ext.set(key, value) }
    }
}

apply from: "https://raw.githubusercontent.com/ixDarkLorD/ModResources/main/gradle/v4/settings.gradle"
