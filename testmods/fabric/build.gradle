apply from: "https://raw.githubusercontent.com/ixDarkLorD/ModResources/main/gradle/v4/fabric.gradle"
apply from: rootProject.file("testmods/testmod.gradle")

dependencies {
    api libs.jei.api.fabric
    implementation libs.jei.fabric

    implementation project(":fabric")
    // Glazed Menu (its own project), from Maven Local.
    implementation("net.ixdarklord.glazedmenu:glazedmenu-fabric:${glazedmenu_version}") { transitive = false }
}

// The other config systems Glazed Menu reads, and Configured, for the tests: compiled against here, and added to a test run
// with -Dfabric.addMods (their jars bundle libraries that only load that way).
dependencies {
    compileOnly("maven.modrinth:cloth-config:${cloth_config_version}") { transitive = false }
    compileOnly("maven.modrinth:yacl:${yacl_version}") { transitive = false }
    compileOnly("maven.modrinth:midnightlib:${midnightlib_version}") { transitive = false }
    compileOnly(libs.forgeconfigapiport.fabric) { transitive = false }
    compileOnly "com.electronwill.night-config:core:3.8.3"
    compileOnly "com.electronwill.night-config:toml:3.8.3"
    compileOnly "curse.maven:configured-457570:${configured_file_id}"
}

// Better Combat and the player animation mod it uses, in a test run only when asked (-Ptest_better_combat=true), to see
// vanilla-model clips share the player's parts with Better Combat's swings.
if (project.findProperty('test_better_combat') == 'true') {
    dependencies {
        localRuntime("maven.modrinth:player-animation-library:${player_animation_library_version}") { transitive = false }
        localRuntime("maven.modrinth:better-combat:${better_combat_version}") { transitive = false }
        localRuntime("maven.modrinth:cloth-config:${cloth_config_version}") { transitive = false }
    }
}
