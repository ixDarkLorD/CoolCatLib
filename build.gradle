plugins {
    alias libs.plugins.architectury.loom apply false
    alias libs.plugins.architectury.plugin apply false
    alias libs.plugins.shadow apply false
    alias libs.plugins.modpublisher apply false
}

// Every project's Java, jar, resource and publishing setup. Canvas (canvas/canvas.gradle) and the test mods
// (testmods/testmod.gradle) add their own on top.
// shared_scripts_url points the shared scripts at another copy, e.g. a local ModResources checkout.
apply from: "${findProperty("shared_scripts_url") ?: "https://raw.githubusercontent.com/ixDarkLorD/ModResources/main/gradle/v4"}/main.gradle"

// Maven coordinates for both mods: net.ixdarklord.coolcatlib:<mod_maven_name>-<loader>, e.g. coolcatlib-core-fabric
// and coolcatlib-canvas-common (the shared script would name them after the mod id and project).
subprojects {
    if (project.name.startsWith("testmod-")) return
    def platform = project.name - "canvas-"
    publishing.publications.mavenJava {
        groupId = "${mod_maven_group}.coolcatlib"
        artifactId = "${mod_maven_name}-${platform}"
    }
}
