modLoader = "javafml"
loaderVersion = "[${min_neoforge_fml_version},)"
issueTrackerURL = "${mod_issue_url}"
license = "${mod_license}"

[[mods]]
modId = "${modid}"
displayName = "${mod_name}"
version = "${version}"
description = "${mod_description}"
authors = "${mod_author}"
logoFile = "mod_logo.png"

# A library: mod lists like Glazed Menu show it under Libraries.
[modproperties.${modid}]
library = true

[[mixins]]
config = "${modid}.common.mixins.json"

[[dependencies.${modid}]]
modId = "coolcatlib"
type = "required"
versionRange = "[${mod_version},)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${modid}]]
modId = "neoforge"
type = "required"
versionRange = "[${min_neoforge_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${modid}]]
modId = "minecraft"
type = "required"
versionRange = "[${mc_version},) , (,${max_mc_version}]"
ordering = "NONE"
side = "BOTH"
