// Shared by the CoolCat Core projects, applied after the shared loader scripts. Those resolve paths from a top-level
// project folder, and Core's projects sit one folder deeper (core/<project>).

// Every mod's changelog lives in its own folder.
tasks.withType(Jar).configureEach {
    from(rootProject.file("core/CHANGELOG.md"))
}

// Keep running from the repository's shared run folder.
if (project.name != "common") {
    loom {
        runs {
            configureEach {
                runDir("../../run")
            }
            server {
                runDir("../../run/server")
            }
        }
    }
}
