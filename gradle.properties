# ─── Gradle ─────────────────────────────────────────────────────────────────────────────────────────────────────────
# Minecraft decompilation needs the memory; the daemon and build cache keep repeated builds fast.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# ─── Build ──────────────────────────────────────────────────────────────────────────────────────────────────────────
# The shared version catalog (net.ixdarklord:sharedcatalogs) and the loaders each mod is built for.
dependencies_catalog_version=26.1.2-v2
project_loaders=fabric,neoforge
project_game_versions=26.1,26.1.1,26.1.2

# ─── Dev Runs ───────────────────────────────────────────────────────────────────────────────────────────────────────
runtime_min_ram=1G
runtime_max_ram=4G
mixin_debug=false

# ─── Shared by both mods ────────────────────────────────────────────────────────────────────────────────────────────
mod_version=1
mod_author=ixDarkLorD
mod_license=MPL-2.0
mod_maven_group=net.ixdarklord
mod_source_url=https://github.com/ixDarkLorD/CoolCatLib
mod_issue_url=https://github.com/ixDarkLorD/CoolCatLib/issues
# "*" for a mod loaded on both sides, "server" for a server only mod, "client" for a client only mod
mod_environment=*
# (Forge) "MATCH_VERSION" for both sides, "IGNORE_SERVER_VERSION" for server only, "IGNORE_ALL_VERSION" for client only
mod_forge_display_test=MATCH_VERSION

# ─── Publishing (both mods) ─────────────────────────────────────────────────────────────────────────────────────────
project_release_type=release
# true uploads nothing, only shows what would be published
project_upload_debug=false
# Copies each built loader jar to build_jar_output_dir (set in the user's gradle.properties)
copy_build_jar=true

# ─── CoolCatLib: Core ───────────────────────────────────────────────────────────────────────────────────────────────
# The shared build scripts read these names as they are.
modid=coolcatcore
# Maven artifacts: net.ixdarklord.coolcatlib:<mod_maven_name>-<loader>
mod_maven_name=coolcatlib-core
mod_name=CoolCatLib: Core
mod_description=Write it once, run it everywhere. Events, networking, registries, configs and more: the purr-fect foundation for your mods.
mod_page_url=https://legacy.curseforge.com/minecraft/mc-mods/coolcatlib
mod_forge_update_url=https://raw.githubusercontent.com/ixDarkLorD/ModResources/refs/heads/main/updates/forge/coolcatlib.json
mod_neoforge_update_url=https://raw.githubusercontent.com/ixDarkLorD/ModResources/refs/heads/main/updates/neoforge/coolcatlib.json
project_curse_id=916525
project_modrinth_id=ASkaoGC8
# Dependencies of the uploaded files, by CurseForge/Modrinth slug: requirement[a,b],optional[c]
fabric_publish_dependencies=requirement[],optional[]
neoforge_publish_dependencies=requirement[],optional[]

# ─── CoolCatLib: Canvas ─────────────────────────────────────────────────────────────────────────────────────────────
# The same fields as Core's; settings.gradle hands them to Canvas's projects without the "canvas_" prefix.
canvas_modid=coolcatcanvas
canvas_mod_maven_name=coolcatlib-canvas
canvas_mod_name=CoolCatLib: Canvas
canvas_mod_description=Paint your world with style. Screen effects, custom skies, slick GUI widgets and render tools: the cat's whiskers of visuals. Requires CoolCatLib: Core.
canvas_mod_page_url=https://www.curseforge.com/minecraft/mc-mods/coolcatlib-canvas
canvas_mod_forge_update_url=https://raw.githubusercontent.com/ixDarkLorD/ModResources/refs/heads/main/updates/forge/coolcatlib.json
canvas_mod_neoforge_update_url=https://raw.githubusercontent.com/ixDarkLorD/ModResources/refs/heads/main/updates/neoforge/coolcatlib.json
canvas_project_curse_id=1716397
canvas_project_modrinth_id=NtytwOvv
# Canvas's files require CoolCatLib: Core (the "coolcatlib" project on both sites).
canvas_fabric_publish_dependencies=requirement[coolcatlib],optional[]
canvas_neoforge_publish_dependencies=requirement[coolcatlib],optional[]
